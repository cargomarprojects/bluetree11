<div *ngIf="tab=='main'">
  <div *ngIf="errorMessage">
    <div class="alert alert-primary">
      {{errorMessage}}
    </div>
  </div>
  <div class="page-body" style="height:80vh">
    <ng2-pdfjs-viewer [showSpinner]="true" [print]="false" [download]="false" [openFile]="false" [zoom]="100"
      [cursor]="'HAND'" [scroll]="'V'" #pdfViewerAutoLoad>
    </ng2-pdfjs-viewer>
  </div>
</div>
